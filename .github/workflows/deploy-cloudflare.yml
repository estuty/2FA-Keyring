# Deploys the static site to Cloudflare Workers (2fa-keyring.<subdomain>.workers.dev)
# on every push to main, then checks that the security headers are live.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   an API token made from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  your Cloudflare account ID
# Until both exist, the workflow skips the deploy instead of failing.
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE_URL: https://2fa-keyring.estuty777.workers.dev
    steps:
      - name: Check for Cloudflare credentials
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "$TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$ACCOUNT" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::warning::Deploy skipped. Repository secret(s) not found:$missing (add them under Settings > Secrets and variables > Actions > Repository secrets)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "Both Cloudflare secrets are present."
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the code
        if: steps.creds.outputs.ok == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        if: steps.creds.outputs.ok == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Deploy with Wrangler
        if: steps.creds.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: npx --yes wrangler@4.151.1 deploy

      - name: Verify the live site
        if: steps.creds.outputs.ok == 'true'
        run: |
          sleep 10
          headers=$(curl -sSfI "$SITE_URL/app/")
          echo "$headers"
          for h in content-security-policy strict-transport-security x-frame-options x-content-type-options referrer-policy permissions-policy; do
            echo "$headers" | grep -qi "^$h:" || { echo "::error::Missing header: $h"; exit 1; }
          done
          echo "$headers" | grep -i "^content-security-policy:" | grep -q "frame-ancestors 'none'" || { echo "::error::CSP lacks frame-ancestors"; exit 1; }
          for f in README.md SECURITY.md wrangler.jsonc _headers .assetsignore; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL/$f")
            [ "$code" = "404" ] || { echo "::error::$f is publicly served (HTTP $code)"; exit 1; }
          done
          for p in / /app/ /security /privacy /terms; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L "$SITE_URL$p")
            [ "$code" = "200" ] || { echo "::error::$p returned HTTP $code"; exit 1; }
          done
          echo "Live site verified: security headers present, repository files not served, all pages load."
